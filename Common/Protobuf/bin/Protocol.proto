syntax = "proto3";

package Protocol;
import "Common.proto";
//import "google/protobuf/timestamp.proto";


enum MsgId {
  Block_value = 0;
  S_Enter_Game = 1001;
  S_Leave_Game = 1002;
  S_Spawn = 1003;
  S_Despawn = 1004;
  C_Move = 1005;
  S_Move = 1006;
  C_Skill = 1007;
  S_Skill = 1008;
  S_Changehp = 1009;
  S_Die = 1010;
  S_Verify = 1011;
  C_Verify = 1012;
  C_Create_Room = 1013;
  C_Room_List = 1014;
  S_Create_Room = 1015;
  C_Enter_Game = 1016;
  S_Message = 1017;
  C_Message = 1018;
  C_Leave_Game = 1019;
  S_Exit_Game = 1020;
}

message C_ENTER_GAME {
   int32 rommId = 1;
   string roomname = 2;
}

message S_ENTER_GAME {
  Common.OBJECT_INFO player = 1;
  int32 roomId = 2;
  string roomname = 3;
}

message C_CREATE_ROOM {
    string roomname = 1;
    string roompwd = 2;
}

message S_CREATE_ROOM {
    bool result = 1;
    int32 roomId = 2;
}

message C_ROOM_LIST {
    string roomname = 1;
}

message S_LEAVE_GAME {
   bool exit = 1;
}

message C_LEAVE_GAME {
    bool exitflag = 1;
}

message S_EXIT_GAME {
    bool exitflag = 1;
}

message S_SPAWN {
    repeated Common.OBJECT_INFO objects = 1;
}

message S_DESPAWN {
    repeated int32 objectIds = 1;
    int32 roomId = 2;
}

message C_MOVE {
    Common.POSITIONINFO posInfo = 1;
}

message S_MOVE {
    int32 objectId = 1;
    Common.POSITIONINFO posInfo = 2;
}

message C_SKILL {
     Common.SkillInfo info = 1;
}

message S_SKILL {
    int32 objectId = 1;
    Common.SkillInfo info = 2;
    int32 roomid = 3;
}

message S_CHANGEHP {
    int32 objectId = 1;
    int32 hp = 2;
}

message S_DIE {
    int32 objectId = 1;
    int32 attackerId = 2;
}

message S_VERIFY {
     bool result = 1;
     string userid = 2;
     string nickname = 3;
}

message C_VERIFY {
     string jwt = 1;
     string userid = 2;
     string nickname = 3;
}

message C_MESSAGE {
    int32 rommId = 1;
    string nickname = 2;
    string message = 3;
}

message S_MESSAGE {
    int32 rommId = 1;
    string nickname = 2;
    string message = 3;
}

